# Reference copy of the production nginx config for the eye-api Lightsail
# instance. The live file is /etc/nginx/sites-available/eye.
#
# __ORIGIN_SECRET__ is a placeholder: the deployed config carries a random
# secret that must match the X-Origin-Verify custom header configured on the
# CloudFront "lightsail-api" origin. Keep the real value out of this repo -
# it lives only on the server and in the CloudFront distribution config.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Origin lock: only CloudFront (which sends the shared X-Origin-Verify
    # header) may reach the API. Direct-to-origin traffic is rejected so
    # rate limits cannot be bypassed by rotating X-Forwarded-For.
    # Paystack webhooks are exempt - they are authenticated by HMAC
    # signature instead of network position.
    location = /api/v1/membership/webhook {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
            return 403;
        }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
